<svg
  width="1600"
  height="1460"
  viewBox="0 0 1600 1460"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <style>
    @font-face {
      font-family: "Restart Soft Medium";
      src: url("https://framerusercontent.com/assets/8UfBECINHY6Ei55XfnI3aVwQF8w.woff2");
      font-weight: 500;
    }

    @font-face {
      font-family: "Restart Soft Regular";
      src: url("https://framerusercontent.com/assets/TdPDh0cKrP2gCKR6q7tJavOqVJI.woff2");
      font-weight: 400;
    }

    @font-face {
      font-family: "Proto Mono Semi Bold";
      src: url("https://framerusercontent.com/assets/w0xZtsUII5gHfdWw0GVIfrETS0s.woff2");
      font-weight: 600;
    }

    .display {
      font-family: "Restart Soft Medium", Arial, sans-serif;
      font-weight: 500;
      fill: #FAF9F5;
      letter-spacing: -0.02em;
    }

    .body {
      font-family: "Restart Soft Regular", Arial, sans-serif;
      font-weight: 400;
      fill: #DCD5CA;
      letter-spacing: -0.02em;
    }

    .mono {
      font-family: "Proto Mono Semi Bold", monospace;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .blue { fill: #3E77E8; }
    .cream { fill: #DCD5CA; }
    .muted { fill: #7C7B77; }

    .hairline {
      stroke: rgba(124,123,119,.5);
      stroke-width: 1;
    }

    .blue-line {
      stroke: #3E77E8;
      stroke-width: 1.5;
    }

    .panel {
      fill: #303030;
      stroke: rgba(124,123,119,.5);
      stroke-width: 1;
    }

    .subpanel {
      fill: #272727;
      stroke: rgba(124,123,119,.5);
      stroke-width: 1;
    }
  </style>

  <defs>
    <marker
      id="arrow-blue"
      markerWidth="8"
      markerHeight="8"
      refX="7"
      refY="4"
      orient="auto"
    >
      <path d="M0 0L8 4L0 8V0Z" fill="#3E77E8"/>
    </marker>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1600" height="1460" fill="#272727"/>

  <!-- HEADER -->
  <text x="64" y="58" class="mono blue" font-size="16">
    BILL SPLITTER POC / TECHNICAL ARCHITECTURE
  </text>

  <text x="64" y="106" class="display" font-size="44">
    Human-reviewed AI splitting, end to end
  </text>

  <text x="64" y="138" class="body" font-size="18">
    React review surface → layered detection → guarded AIA push
  </text>

  <line x1="64" y1="174" x2="1536" y2="174" class="hairline"/>

  <!-- FLOW SUMMARY -->
  <rect x="64" y="210" width="1472" height="110" class="subpanel"/>

  <text x="88" y="240" class="mono muted" font-size="12">
    SYSTEM FLOW
  </text>

  <text x="88" y="279" class="display" font-size="18">React SPA</text>
  <line x1="188" y1="274" x2="292" y2="274" class="blue-line" marker-end="url(#arrow-blue)"/>

  <text x="318" y="279" class="display" font-size="18">FastAPI</text>
  <line x1="394" y1="274" x2="498" y2="274" class="blue-line" marker-end="url(#arrow-blue)"/>

  <text x="524" y="279" class="display" font-size="18">Detect boundaries</text>
  <line x1="675" y1="274" x2="779" y2="274" class="blue-line" marker-end="url(#arrow-blue)"/>

  <text x="805" y="279" class="display" font-size="18">Human review</text>
  <line x1="929" y1="274" x2="1033" y2="274" class="blue-line" marker-end="url(#arrow-blue)"/>

  <text x="1059" y="279" class="display" font-size="18">Split PDFs</text>
  <line x1="1155" y1="274" x2="1259" y2="274" class="blue-line" marker-end="url(#arrow-blue)"/>

  <text x="1285" y="279" class="display" font-size="18">Push to AIA</text>

  <!-- ===================================================== -->
  <!-- FRONTEND -->
  <!-- ===================================================== -->

  <rect x="64" y="356" width="716" height="486" class="panel"/>

  <text x="88" y="390" class="mono blue" font-size="14">
    01 / FRONTEND
  </text>

  <text x="88" y="425" class="display" font-size="26">
    React SPA
  </text>

  <text x="88" y="451" class="body" font-size="15">
    Lightweight review surface where the human confirms what AI found.
  </text>

  <!-- FRONTEND / state -->
  <rect x="88" y="484" width="668" height="112" class="subpanel"/>

  <text x="108" y="513" class="mono muted" font-size="12">
    split-state.ts
  </text>

  <text x="108" y="541" class="display" font-size="17">
    Session state and derived bills stay separate
  </text>

  <text x="108" y="565" class="body" font-size="14">
    cuts · excludedPages · labels · names → deriveDocuments() · uncoveredPages()
  </text>

  <text x="108" y="584" class="body muted" font-size="13">
    Why: detection never renders fake bills before the real result exists.
  </text>

  <!-- FRONTEND / flags -->
  <rect x="88" y="612" width="668" height="112" class="subpanel"/>

  <text x="108" y="641" class="mono muted" font-size="12">
    doc-needs-look.ts
  </text>

  <text x="108" y="669" class="display" font-size="17">
    Review flags become start-class or hold-class
  </text>

  <text x="108" y="693" class="body" font-size="14">
    startClassReasons · holdClassReasons · pruneConfirmedStarts · docNeedsLook()
  </text>

  <text x="108" y="712" class="body muted" font-size="13">
    Why: the UI knows whether to offer “Looks right” or “Split here”.
  </text>

  <!-- FRONTEND / files -->
  <rect x="88" y="740" width="320" height="78" class="subpanel"/>

  <text x="108" y="767" class="mono muted" font-size="12">
    aiaFilenames.ts
  </text>

  <text x="108" y="792" class="display" font-size="16">
    Filename parity
  </text>

  <text x="108" y="811" class="body" font-size="13">
    packet-VEN3-number.pdf
  </text>

  <!-- FRONTEND / UI -->
  <rect x="424" y="740" width="332" height="78" class="subpanel"/>

  <text x="444" y="767" class="mono muted" font-size="12">
    UI COMPONENTS
  </text>

  <text x="444" y="792" class="display" font-size="16">
    Stream + inspector
  </text>

  <text x="444" y="811" class="body" font-size="13">
    Upload · BoundaryStream · Topbar · PageHeader
  </text>

  <!-- ===================================================== -->
  <!-- BACKEND -->
  <!-- ===================================================== -->

  <rect x="820" y="356" width="716" height="486" class="panel"/>

  <text x="844" y="390" class="mono blue" font-size="14">
    02 / BACKEND
  </text>

  <text x="844" y="425" class="display" font-size="26">
    FastAPI
  </text>

  <text x="844" y="451" class="body" font-size="15">
    Layered detection because one signal is never reliable enough.
  </text>

  <!-- LAYER 1 -->
  <rect x="844" y="484" width="668" height="90" class="subpanel"/>

  <text x="864" y="511" class="mono blue" font-size="12">
    LAYER 01
  </text>

  <text x="864" y="536" class="display" font-size="17">
    Deterministic signals
  </text>

  <text x="864" y="559" class="body" font-size="13">
    Header / letterhead change → candidate starts. Fast and cheap, but incomplete.
  </text>

  <!-- LAYER 2 -->
  <rect x="844" y="590" width="668" height="90" class="subpanel"/>

  <text x="864" y="617" class="mono blue" font-size="12">
    LAYER 02
  </text>

  <text x="864" y="642" class="display" font-size="17">
    Mistral OCR + boundary judge
  </text>

  <text x="864" y="665" class="body" font-size="13">
    OCR reads every page; an LLM compares pages and marks likely invoice starts.
  </text>

  <!-- LAYER 3 -->
  <rect x="844" y="696" width="668" height="90" class="subpanel"/>

  <text x="864" y="723" class="mono blue" font-size="12">
    LAYER 03
  </text>

  <text x="864" y="748" class="display" font-size="17">
    Post-judge overlay
  </text>

  <text x="864" y="771" class="body" font-size="13">
    Constraints clean up blank pages, conflicts, merge and split suggestions.
  </text>

  <text x="844" y="817" class="mono muted" font-size="12">
    main.py · enforce_constraints_on_starts() · boundary_overlay
  </text>

  <!-- ===================================================== -->
  <!-- REVIEW MODEL -->
  <!-- ===================================================== -->

  <rect x="64" y="882" width="716" height="272" class="panel"/>

  <text x="88" y="916" class="mono blue" font-size="14">
    03 / FLAG MODEL
  </text>

  <text x="88" y="951" class="display" font-size="25">
    Uncertainty becomes explicit UI
  </text>

  <!-- Start class -->
  <rect x="88" y="982" width="320" height="142" class="subpanel"/>

  <text x="108" y="1012" class="mono blue" font-size="12">
    START-CLASS
  </text>

  <text x="108" y="1039" class="display" font-size="17">
    “Looks right”
  </text>

  <text x="108" y="1064" class="body" font-size="13">
    <tspan x="108" dy="0">Confirms an uncertain cut.</tspan>
    <tspan x="108" dy="19">Session-local acknowledgement.</tspan>
    <tspan x="108" dy="19">Removed if the start cut disappears.</tspan>
  </text>

  <!-- Hold class -->
  <rect x="424" y="982" width="332" height="142" class="subpanel"/>

  <text x="444" y="1012" class="mono blue" font-size="12">
    HOLD-CLASS
  </text>

  <text x="444" y="1039" class="display" font-size="17">
    “Split here”
  </text>

  <text x="444" y="1064" class="body" font-size="13">
    <tspan x="444" dy="0">Marks a conflict at a held divider.</tspan>
    <tspan x="444" dy="19">Requires explicit user action.</tspan>
    <tspan x="444" dy="19">Cleared only after the cut is made.</tspan>
  </text>

  <!-- ===================================================== -->
  <!-- AIA INTEGRATION -->
  <!-- ===================================================== -->

  <rect x="820" y="882" width="716" height="272" class="panel"/>

  <text x="844" y="916" class="mono blue" font-size="14">
    04 / AIA INTEGRATION
  </text>

  <text x="844" y="951" class="display" font-size="25">
    Guarded push into Accounts Payable
  </text>

  <!-- handshake -->
  <text x="844" y="988" class="mono muted" font-size="12">
    DMS HANDSHAKE / client.py push_bill
  </text>

  <text x="864" y="1024" class="display" font-size="16">1</text>
  <text x="892" y="1024" class="body" font-size="14">upload-file-to-dms → UUID + presigned URL</text>

  <text x="864" y="1054" class="display" font-size="16">2</text>
  <text x="892" y="1054" class="body" font-size="14">upload-file → base64 body</text>

  <text x="864" y="1084" class="display" font-size="16">3</text>
  <text x="892" y="1084" class="body" font-size="14">PATCH status → uploaded</text>

  <text x="864" y="1114" class="display" font-size="16">4</text>
  <text x="892" y="1114" class="body" font-size="14">bill-status poll → terminal HITL result</text>

  <line x1="1222" y1="991" x2="1222" y2="1124" class="hairline"/>

  <text x="1250" y="1015" class="mono blue" font-size="12">
    WRITE GATE
  </text>

  <text x="1250" y="1043" class="body" font-size="13">
    AIA_API_BASE
  </text>

  <text x="1250" y="1065" class="mono muted" font-size="12">
    AND
  </text>

  <text x="1250" y="1092" class="body" font-size="13">
    AIA_ALLOW_WRITES=true
  </text>

  <text x="1250" y="1118" class="body muted" font-size="12">
    Prevents demo writes.
  </text>

  <!-- ===================================================== -->
  <!-- EXTRACTION + DEPLOY -->
  <!-- ===================================================== -->

  <rect x="64" y="1194" width="716" height="166" class="panel"/>

  <text x="88" y="1228" class="mono blue" font-size="14">
    05 / EXTRACTION
  </text>

  <text x="88" y="1261" class="display" font-size="22">
    Three-tier grounding
  </text>

  <text x="88" y="1292" class="body" font-size="14">
    A / source-line grounded
  </text>

  <text x="300" y="1292" class="body" font-size="14">
    B / value-faithful
  </text>

  <text x="492" y="1292" class="body" font-size="14">
    C / contiguous evidence
  </text>

  <text x="88" y="1324" class="body muted" font-size="13">
    A value is trusted only when it can be verified against page text.
  </text>

  <!-- DEPLOY -->
  <rect x="820" y="1194" width="716" height="166" class="panel"/>

  <text x="844" y="1228" class="mono blue" font-size="14">
    06 / DEPLOYMENT
  </text>

  <text x="844" y="1261" class="display" font-size="22">
    One service, one deploy
  </text>

  <text x="844" y="1292" class="body" font-size="14">
    Render serving master · FastAPI serves web/dist
  </text>

  <text x="844" y="1318" class="body" font-size="14">
    Port 7790 · /healthz · /assets
  </text>

  <text x="844" y="1342" class="body muted" font-size="13">
    Frontend ships as static assets behind the same backend.
  </text>

  <!-- FOOTER -->
  <line x1="64" y1="1398" x2="1536" y2="1398" class="hairline"/>

  <text x="64" y="1430" class="mono muted" font-size="12">
    ARCHITECTURE PRINCIPLE
  </text>

  <text x="232" y="1430" class="body" font-size="14">
    AI proposes boundaries. Deterministic rules constrain them. Humans resolve uncertainty. Writes stay gated.
  </text>
</svg>
